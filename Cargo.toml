[package]
name = "learn_ecs"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = [ "dynamic_linking" ] }
avian3d = "0.7"
log = { version = "*", features = [ "max_level_debug", "release_max_level_warn" ] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
